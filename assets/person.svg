<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!--
    Google Material Symbols, "person" (filled).
    Copyright Google LLC, licensed under the Apache License 2.0.
    Changed: recoloured for the panel.

    This is the mark that stands in for the user's picture. Material's
    "account_circle" was the wrong one: it is a filled disc with the person
    knocked out of it, and a disc in a circle loses the corners the knockout
    was drawn against, so it read as a blob rather than as a person. A person
    on its own, clipped to the circle, is the shape every other desktop uses
    for a face it does not have.
  -->
  <path fill="#e8e8e8" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
</svg>
